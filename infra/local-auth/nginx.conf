# Gateway locale: espone Supabase Auth su /auth/v1 e Storage su /storage/v1 come fa la piattaforma.
# SOLO SVILUPPO/TEST.
server {
  listen 80;
  location /auth/v1/ {
    proxy_pass http://gotrue:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /storage/v1/ {
    # Come il gateway della piattaforma: risponde al preflight CORS del browser, che carica
    # i file direttamente sullo storage con un URL firmato (il token è nell'URL, non nei cookie).
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "$http_origin" always;
      add_header Access-Control-Allow-Methods "GET, PUT, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type, x-upsert, cache-control" always;
      add_header Access-Control-Max-Age 600 always;
      add_header Vary Origin always;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Vary Origin always;
    proxy_pass http://storage:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
  }
  location / { return 404; }
}
